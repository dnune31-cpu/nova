<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova · study helper</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root{
  --space:#05060f; --star:#eef1ff; --gold:#ffcf8a; --blue:#8fb3ff; --muted:#8a90b0;
  --line:rgba(238,241,255,.12); --panel:rgba(12,14,32,.72); --solid:#0b0d1f; --red:#ff9d9d;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--space);color:var(--star);font-family:"Sora",system-ui,sans-serif;font-weight:300;font-size:16px;line-height:1.65;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font-family:inherit}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* auth */
#authView{position:relative;z-index:1;min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:380px;background:rgba(11,13,31,.88);border:1px solid var(--line);border-radius:22px;padding:28px 26px 22px}
.card canvas{width:96px;height:96px;display:block;margin:-6px 0 6px -8px}
.card h1{font-size:24px;font-weight:600;margin:0 0 4px;line-height:1.25}
.card .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;background:none;border:0;color:var(--muted);font-size:14px;padding:7px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected=true]{background:rgba(255,207,138,.14);color:var(--gold)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:11px;color:var(--star);font:inherit;font-size:15px;padding:10px 12px;outline:0}
.field input:focus{border-color:rgba(255,207,138,.55)}
.primary{width:100%;background:var(--gold);color:#1a1405;border:0;border-radius:12px;font-size:15px;font-weight:600;padding:11px;cursor:pointer;margin-top:4px}
.primary:disabled{opacity:.5;cursor:default}
.aerr{color:var(--red);font-size:13px;margin:0 0 10px}
.aerr:empty{display:none}
.afoot{display:flex;justify-content:flex-end;margin-top:14px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 0}
.linkbtn:hover{color:var(--star)}

/* app shell */
#appView{position:relative;z-index:1;height:100%;display:flex}
.rail{flex:none;width:60px;height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;background:rgba(9,11,26,.92);border-right:1px solid var(--line);z-index:6}
.rbtn{width:40px;height:40px;border-radius:12px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rbtn svg{width:21px;height:21px}
.rbtn:hover,.rbtn[aria-expanded=true],.rbtn.on{color:var(--gold);background:rgba(255,255,255,.06)}
.rbtn.new{color:#1a1405;background:var(--gold);margin-bottom:6px}
.rbtn.new:hover{color:#1a1405;background:#ffdca6}
.rail .gap{flex:1}
.avatar{width:34px;height:34px;border-radius:50%;background:rgba(143,179,255,.2);border:1px solid rgba(143,179,255,.45);color:var(--star);font-size:14px;font-weight:600;cursor:pointer}
#panel{position:absolute;left:60px;top:0;bottom:0;width:290px;max-width:calc(100% - 60px);background:var(--solid);border-right:1px solid var(--line);z-index:5;display:flex;flex-direction:column;padding:16px 10px 12px}
#panel h2{font-size:15px;font-weight:600;margin:0 6px 10px}
#chatList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.citem{display:flex;align-items:center;border-radius:10px}
.citem:hover,.citem.on{background:rgba(255,255,255,.05)}
.citem.on .ctitle{color:var(--gold)}
.copen{flex:1;min-width:0;background:none;border:0;color:var(--star);text-align:left;padding:8px 8px;cursor:pointer}
.ctitle{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctime{display:block;font-size:12px;color:var(--muted)}
.cdel{flex:none;background:none;border:0;color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;opacity:0}
.citem:hover .cdel,.cdel:focus-visible{opacity:1}
.cdel:hover{color:var(--red)}
.cempty{color:var(--muted);font-size:14px;padding:6px 8px}
#menu{position:absolute;left:68px;bottom:14px;width:240px;background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:12px;z-index:7}
#menu .who{font-weight:600}
#menu .mail{color:var(--muted);font-size:13px;word-break:break-all;margin-bottom:10px}
#menu button{width:100%;text-align:left;background:none;border:1px solid var(--line);color:var(--star);border-radius:10px;padding:8px 10px;font-size:14px;cursor:pointer}
#menu button:hover{border-color:rgba(255,157,157,.5);color:var(--red)}
.stage{flex:1;min-width:0;height:100%;overflow:hidden}

/* chat */
.app{height:100%;display:flex;flex-direction:column;max-width:780px;margin:0 auto;padding:0 18px}
header.top{display:flex;align-items:center;gap:12px;padding:16px 0 12px;border-bottom:1px solid var(--line);min-width:0}
header.top canvas{width:34px;height:34px;flex:none}
header.top h1{font-size:18px;font-weight:600;margin:0}
#chatTitle{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
main{flex:1;overflow-y:auto;padding:24px 0}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin-top:5vh}
.empty canvas{width:120px;height:120px}
.empty h2{font-size:28px;font-weight:600;margin:0;line-height:1.2}
.empty p{margin:0;color:var(--muted);max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--star);font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.msg{margin:0 0 22px}
.user{display:flex;justify-content:flex-end}
.user .stack{display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:80%}
.user .txt{background:rgba(143,179,255,.16);border:1px solid rgba(143,179,255,.35);padding:10px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap;word-wrap:break-word}
.user .pics{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.user .pics img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.user .tag{font-size:13px;color:var(--blue);border:1px solid rgba(143,179,255,.3);border-radius:8px;padding:3px 8px;word-break:break-all}
.ai{display:flex;gap:12px}
.ai .dot{flex:none;width:8px;height:8px;margin-top:10px;border-radius:50%;background:var(--gold)}
.ai .body{min-width:0;flex:1}
.ai .body>*:first-child{margin-top:0}.ai .body>*:last-child{margin-bottom:0}
.ai pre{background:rgba(0,0,0,.45);border:1px solid var(--line);padding:12px;border-radius:8px;overflow-x:auto}
.ai code{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.ai :not(pre)>code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px}
.ai strong{font-weight:600;color:var(--gold)}
.ai .katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}
.ai.err .body{color:var(--red)}
.ai .model{font-size:12px;color:var(--muted);margin-top:6px}
.think{color:var(--muted);font-size:14px}
form#f{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:10px 10px 8px 14px;margin:0 0 18px}
form#f:focus-within{border-color:rgba(255,207,138,.5)}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;background:none;border:0;outline:0;color:var(--star);font:inherit;resize:none;max-height:180px;padding:6px 0}
textarea::placeholder{color:var(--muted)}
#send{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--gold);color:#1a1405;font-size:18px;cursor:pointer}
#send:disabled{opacity:.4;cursor:default}
.tools{display:flex;align-items:center;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.tool{background:none;border:0;color:var(--muted);width:34px;height:34px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tool:hover,.tool[aria-pressed=true]{color:var(--gold);background:rgba(255,255,255,.05)}
.tool svg{width:19px;height:19px}
#model{margin-left:auto;background:rgba(255,255,255,.04);color:var(--star);border:1px solid var(--line);border-radius:999px;font:inherit;font-size:13px;padding:6px 10px;cursor:pointer;max-width:60%}
#model option{background:#0c0e20}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.tray:empty{display:none}
.att{position:relative;display:flex;align-items:center;background:rgba(143,179,255,.1);border:1px solid rgba(143,179,255,.3);border-radius:10px;font-size:13px;max-width:220px}
.att img{width:52px;height:52px;object-fit:cover;border-radius:9px;display:block}
.att span{padding:6px 26px 6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att button{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:0;background:#2a2f4d;color:var(--star);font-size:12px;cursor:pointer;line-height:1}
.linkrow{display:flex;gap:8px;margin-bottom:8px}
.linkrow input{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;color:var(--star);font:inherit;font-size:14px;padding:7px 10px;outline:0}
.linkrow button{background:none;border:1px solid var(--line);color:var(--star);font-size:13px;border-radius:10px;padding:0 12px;cursor:pointer}
.ferr{color:var(--red);font-size:13px;margin:0 0 8px}
.ferr:empty{display:none}

/* admin */
#adminView{height:100%;overflow-y:auto;padding:22px 24px 40px}
.ahead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.ahead h2{font-size:24px;font-weight:600;margin:0 auto 0 0}
.ghost{background:none;border:1px solid var(--line);color:var(--star);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.ghost:hover{border-color:rgba(238,241,255,.35)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:24px;font-weight:600;color:var(--gold)}
.stat span{font-size:13px;color:var(--muted)}
.sect{font-size:16px;font-weight:600;margin:0 0 10px}
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:rgba(11,13,31,.8);margin-bottom:26px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th{text-align:left;font-weight:400;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td .nm{font-weight:600}
td .em{color:var(--muted);font-size:12px;word-break:break-all}
.mods{display:flex;gap:10px;flex-wrap:wrap}
.mods label{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}
.mods input{accent-color:#ffcf8a}
.pill{border-radius:999px;padding:4px 10px;font-size:12px;border:1px solid var(--line);background:none;color:var(--star);cursor:pointer}
.pill.ok{color:#9be3b8;border-color:rgba(155,227,184,.4)}
.pill.no{color:var(--red);border-color:rgba(255,157,157,.4)}
.saved{font-size:12px;color:var(--muted)}
.loglist{border:1px solid var(--line);border-radius:14px;background:rgba(11,13,31,.8)}
.logrow{display:flex;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:14px}
.logrow:last-child{border-bottom:0}
.logrow .t{color:var(--muted);margin-left:auto;white-space:nowrap}
.logrow .k{color:var(--gold);white-space:nowrap}
.adminerr{color:var(--red)}

@media (max-width:600px){
  .rail{width:52px}.rbtn{width:36px;height:36px}
  #panel{left:52px;max-width:calc(100% - 52px)}#menu{left:58px}
  .app{padding:0 12px}.empty h2{font-size:23px}.user .stack{max-width:90%}
  #adminView{padding:18px 14px 30px}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<section id="authView" hidden>
  <div class="card">
    <canvas id="authSwirl" width="192" height="192" aria-hidden="true"></canvas>
    <h1 id="authTitle">Welcome to Nova</h1>
    <p class="sub" id="authSub">Your study helper. Log in or create an account to start.</p>
    <div class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" data-mode="login" aria-selected="true">Log in</button>
      <button type="button" role="tab" data-mode="register" aria-selected="false">Create account</button>
    </div>
    <form id="authForm" novalidate>
      <label class="field" id="nameField" hidden><span>Name</span><input id="aName" autocomplete="name" maxlength="40"></label>
      <label class="field"><span>Email</span><input id="aEmail" type="email" autocomplete="email" required></label>
      <label class="field"><span>Password</span><input id="aPass" type="password" autocomplete="current-password" required></label>
      <p class="aerr" id="aErr" role="alert"></p>
      <button class="primary" id="aSubmit" type="submit">Log in</button>
    </form>
    <div class="afoot"><button class="linkbtn" type="button" id="adminLink">Admin</button></div>
  </div>
</section>

<div id="appView" hidden>
  <nav class="rail" aria-label="Nova">
    <button class="rbtn new" id="rNew" title="New chat" aria-label="New chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="rbtn" id="rChats" title="Your chats" aria-label="Your chats" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/><path d="M8.5 10.5h7M8.5 13.5h4.5"/></svg></button>
    <div class="gap"></div>
    <button class="rbtn" id="rAdmin" title="Admin" aria-label="Admin" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><rect x="9" y="11" width="6" height="5" rx="1"/><path d="M10 11V9.5a2 2 0 0 1 4 0V11"/></svg></button>
    <button class="avatar" id="rMe" aria-label="Account" aria-expanded="false">?</button>
  </nav>

  <aside id="panel" hidden aria-label="Your chats">
    <h2>Your chats</h2>
    <div id="chatList"></div>
  </aside>

  <div id="menu" hidden>
    <div class="who" id="meName"></div>
    <div class="mail" id="meEmail"></div>
    <button type="button" id="logout">Log out</button>
  </div>

  <div class="stage">
    <div class="app" id="chatView">
      <header class="top">
        <canvas id="headSwirl" width="68" height="68" aria-hidden="true"></canvas>
        <h1>Nova</h1>
        <span id="chatTitle"></span>
      </header>
      <main id="log" aria-live="polite"></main>
      <form id="f">
        <p class="ferr" id="ferr" role="alert"></p>
        <div class="linkrow" id="linkrow" hidden>
          <input id="linkin" type="url" placeholder="https://example.com/article" aria-label="Link to add">
          <button type="button" id="linkadd">Add link</button>
        </div>
        <div class="tray" id="tray"></div>
        <div class="row">
          <textarea id="q" rows="1" placeholder="Ask a question or paste a problem" aria-label="Message Nova"></textarea>
          <button id="send" type="submit" aria-label="Send">↑</button>
        </div>
        <div class="tools">
          <button class="tool" type="button" id="bPhoto" title="Add photos" aria-label="Add photos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg></button>
          <button class="tool" type="button" id="bFile" title="Add a file (PDF or text)" aria-label="Add a file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></button>
          <button class="tool" type="button" id="bLink" title="Add a link" aria-label="Add a link" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
          <select id="model" aria-label="Model"></select>
        </div>
        <input type="file" id="pickPhoto" accept="image/*" multiple hidden>
        <input type="file" id="pickFile" accept=".pdf,.txt,.md,.csv,.json,.js,.py,.java,.html,.css,.c,.cpp" multiple hidden>
      </form>
    </div>

    <section id="adminView" hidden>
      <div class="ahead">
        <h2>Admin</h2>
        <button class="ghost" type="button" id="aRefresh">Refresh</button>
        <button class="ghost" type="button" id="aBack">Back to chat</button>
      </div>
      <div id="adminBody"><p class="think">Loading…</p></div>
    </section>
  </div>
</div>

<script>
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let spin = 1, spinTarget = 1;

/* background starfield */
(() => {
  const cv = document.getElementById("sky"), ctx = cv.getContext("2d");
  let W, H, stars = [];
  function size() {
    const d = devicePixelRatio || 1;
    W = cv.width = innerWidth * d; H = cv.height = innerHeight * d;
    stars = Array.from({length: Math.round(innerWidth * innerHeight / 3500)}, () => ({
      x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.1 + .3) * d,
      p: Math.random() * 6, c: Math.random() < .15 ? "255,207,138" : Math.random() < .3 ? "143,179,255" : "238,241,255"
    }));
  }
  size(); addEventListener("resize", size);
  function f(t) {
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      const a = reduce ? .5 : .3 + .35 * Math.sin(t * .0008 + s.p);
      ctx.fillStyle = `rgba(${s.c},${a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
})();

/* spiral galaxy swirl (avatar + welcome) */
function swirl(cv, n) {
  const ctx = cv.getContext("2d"), P = [];
  for (let i = 0; i < n; i++) {
    const r = Math.pow(Math.random(), 1.5), q = Math.random();
    const c = r < .2 ? (q < .6 ? "255,214,150" : "255,245,228")
            : r < .55 ? (q < .5 ? "255,250,240" : q < .8 ? "255,207,138" : "170,200,255")
            : (q < .6 ? "143,179,255" : "235,240,255");
    P.push({r, a: (i % 2) * Math.PI + r * 5.5 + (Math.random() - .5) * (.5 + r * .9), s: (Math.random() * 1.2 + .5) * (1 - r * .4), c, w: Math.random() * 6});
  }
  let last = 0, phase = 0;
  function f(t) {
    const W = cv.width, H = cv.height, cx = W / 2, cy = H / 2, R = W * .48, k = W / 120;
    phase += reduce ? 0 : (t - last) * .00025 * spin; last = t;
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * .4);
    g.addColorStop(0, "rgba(255,236,195,.95)"); g.addColorStop(.35, "rgba(255,200,120,.35)"); g.addColorStop(1, "rgba(255,200,120,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * .4, 0, 7); ctx.fill();
    for (const p of P) {
      const an = p.a + phase / (p.r + .25);
      ctx.fillStyle = `rgba(${p.c},${.55 + .45 * Math.sin(t * .003 + p.w)})`;
      ctx.beginPath(); ctx.arc(cx + Math.cos(an) * p.r * R, cy + Math.sin(an) * p.r * R, p.s * k, 0, 7); ctx.fill();
    }
    for (let j = 0; j < 2; j++) {
      const p = P[(j * 53) % n], an = p.a + phase / (p.r + .25), x = cx + Math.cos(an) * p.r * R, y = cy + Math.sin(an) * p.r * R;
      const L = (5 + 3 * Math.sin(t * .004 + j)) * k;
      ctx.strokeStyle = "rgba(255,240,210,.85)"; ctx.lineWidth = .8 * k;
      ctx.beginPath(); ctx.moveTo(x - L, y); ctx.lineTo(x + L, y); ctx.moveTo(x, y - L); ctx.lineTo(x, y + L); ctx.stroke();
    }
    spin += (spinTarget - spin) * .05;
    if (cv.isConnected) requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
}

async function api(path, opts = {}) {

function ago(t) {
  if (!t) return "never";
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  if (s < 86400 * 7) return Math.round(s / 86400) + " d ago";
  return new Date(t).toLocaleDateString();
}

function renderMath(md) {
  const store = [];
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => { store.push([m, true]); return `@@M${store.length - 1}@@`; })
         .replace(/\\\[([\s\S]+?)\\\]/g, (_, m) => { store.push([m, true]); return `@@M${store.length - 1}@@`; })
         .replace(/\\\(([\s\S]+?)\\\)/g, (_, m) => { store.push([m, false]); return `@@M${store.length - 1}@@`; })
         .replace(/\$([^\$\n]+?)\$/g, (_, m) => { store.push([m, false]); return `@@M${store.length - 1}@@`; });
  let html = DOMPurify.sanitize(marked.parse(md));
  return html.replace(/@@M(\d+)@@/g, (_, i) => {
    const [tex, display] = store[+i];
    try { return katex.renderToString(tex, {displayMode: display, throwOnError: false}); }
    catch { return tex; }
  });
}

function drawTray() {
  tray.innerHTML = "";
  const items = [...pending.attachments.map((a, i) => ({a, i, kind: "att"})), ...pending.links.map((l, i) => ({l, i, kind: "link"}))];

    } else {

function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL("image/jpeg", 0.8);
      URL.revokeObjectURL(url);
      resolve({type: "image", media_type: "image/jpeg", data: dataUrl.split(",")[1], preview: dataUrl, name: file.name || "photo"});
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That image couldn't be opened")); };
    img.src = url;
  });
}

function readAsBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(",")[1]);
    r.onerror = () => reject(new Error("That file couldn't be read"));
    r.readAsDataURL(file);
  });
}

async function addFiles(files) {
  showError("");
  for (const f of files) {
    if (pending.attachments.length >= MAX_ATTACH) { showError(`You can add up to ${MAX_ATTACH} attachments per message.`); break; }
    try {
      if (f.type.startsWith("image/")) {
        pending.attachments.push(await shrinkImage(f));
      } else if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
        if (f.size > MAX_PDF) { showError(`${f.name} is too big. PDFs can be up to 3 MB.`); continue; }
        pending.attachments.push({type: "pdf", data: await readAsBase64(f), name: f.name});
      } else {
        const text = await f.text();
        pending.attachments.push({type: "text", text: text.slice(0, 60000), name: f.name});
      }
    } catch (e) { showError(e.message); }
  }
  drawTray();
}

function add(role, msg, opts = {}) {
  if (log.querySelector(".empty")) log.innerHTML = "";
  const el = document.createElement("div");
  if (role === "user") {
    el.className = "msg user";
    const stack = document.createElement("div"); stack.className = "stack";
    const atts = msg.attachments || [];
    const pics = atts.filter(a => a.type === "image" && a.preview);
    if (pics.length) {
      const p = document.createElement("div"); p.className = "pics";
      pics.forEach(a => { const i = document.createElement("img"); i.src = a.preview; i.alt = a.name; p.appendChild(i); });
      stack.appendChild(p);
    }
    const names = atts.length ? atts.filter(a => !(a.type === "image" && a.preview)).map(a => a.name) : (msg.files || []);
    for (const n of names) { const c = document.createElement("div"); c.className = "tag"; c.textContent = "📎 " + n; stack.appendChild(c); }
    for (const l of msg.links || []) { const c = document.createElement("div"); c.className = "tag"; c.textContent = "🔗 " + l; stack.appendChild(c); }
    if (msg.content) { const t = document.createElement("div"); t.className = "txt"; t.textContent = msg.content; stack.appendChild(t); }
    el.appendChild(stack);
  } else {
    el.className = "msg ai" + (opts.err ? " err" : "");
    el.innerHTML = `<span class="dot"></span><div class="body"></div>`;
    const body = el.querySelector(".body");
    body.innerHTML = opts.err ? DOMPurify.sanitize(msg) : renderMath(msg);
    if (opts.model) { const w = document.createElement("div"); w.className = "model"; w.textContent = NAMES[opts.model] || opts.model; body.appendChild(w); }
  }
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

  const model = $("model").value;

  });

  busy = true; send.disabled = true; showError("");

    add("assistant", err.message + ". Your message wasn't sent, so try again.", {err: true});

      b.onclick = async () => {
        if (!u.blocked && !confirm(`Block ${u.name}? They won't be able to use Nova.`)) return;
        try { await api("/api/admin", {method: "POST", body: JSON.stringify({email: u.email, blocked: !u.blocked})}); u.blocked = !u.blocked; paint(); }
        catch (err) { alert(err.message); }
      };
      acc.appendChild(b);
    }
    rows.appendChild(tr);
  }

  const lr = $("logRows");
  if (!events.length) lr.innerHTML = `<div class="logrow">No logins yet.</div>`;
  const byEmail = Object.fromEntries(users.map(u => [u.email, u.name]));
  for (const ev of events) {
    const d = document.createElement("div"); d.className = "logrow";
    d.innerHTML = `<span class="k"></span><span class="w"></span><span class="t"></span>`;
    d.querySelector(".k").textContent = ev.type === "signup" ? "Signed up" : ev.type === "admin login" ? "Admin login" : "Logged in";
    d.querySelector(".w").textContent = byEmail[ev.email] ? `${byEmail[ev.email]} (${ev.email})` : ev.email;
    d.querySelector(".t").textContent = ago(ev.time);
    lr.appendChild(d);
  }
}

/* ---------- start ---------- */
(async () => {
  try { const d = await api("/api/auth"); d.user ? enterApp(d.user) : showAuth(); }
  catch (err) { showAuth(err.message); }
})();
</script>
</body>
</html>
