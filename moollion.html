<script>
/* Moo-llion on its own site. No accounts: this browser keeps a random player id, and you pick a name. */
let PID = null;
try { PID = localStorage.getItem("moollion-player"); } catch {}
if (!/^[a-f0-9]{32}$/.test(PID || "")) {
  PID = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, "0")).join("");
  try { localStorage.setItem("moollion-player", PID); } catch {}
}
async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {"Content-Type": "application/json", "x-moo-player": PID}});
  let d = {};
  try { d = await r.json(); } catch {}
  if (!r.ok) { const e = new Error(d.error || "Something went wrong"); e.status = r.status; e.data = d; throw e; }
  return d;
}
function handleAuthError() { return false; }

/* ---------- Moo-llion: daily word game, the rarer your answer the higher your cow floats ---------- */
function startMoo(root) {
  const IMG = "https://d8j0ntlcm91z4.cloudfront.net/user_3KOBfqwOB9ikrbu9I0UQir2iysj/hf_20261109_";
  const SCENES = ["010015_b7dfcf78-f8cd-4ca6-afe7-28cc5c5c705a", "010014_0b70e6ac-9caf-47e8-a9a9-fc84493a60a1", "010014_06a075f2-9d53-4f46-bbf8-cccd147b1b17",
    "010014_7805181d-ae17-4f85-88b4-badffc9feb02", "010015_477b5311-ba65-4b30-9b88-cab11688d00d", "010013_e8d385b4-bd8f-45bf-a541-948406faccf6",
    "010013_87567b9b-0dc4-43e7-b16d-ee1b203ec47e"].map(id => IMG + id + "_min.webp");
  // where you are in the sky (by total height), with the picture for each
  const ZONES = [
    {at: 0, scene: 1, name: "The Pasture", text: "Hay bales, a red barn, a winding path. Your hooves just left the grass."},
    {at: 200, scene: 2, name: "The Treetops", text: "The roof of the forest, right under your hooves."},
    {at: 900, scene: 3, name: "The Clouds", text: "Soft white puffs on every side. The farm is a quilt far below."},
    {at: 3000, scene: 4, name: "The Jet Stream", text: "Fast winds and a golden sunset. A plane waves its wings at you."},
    {at: 8000, scene: 5, name: "The Stratosphere", text: "The Earth curves away below and the sky turns dark blue."},
    {at: 15000, scene: 6, name: "Deep Space", text: "Stars all around and the Moon up close. One in a moo-llion."},
  ];
  const SKY = ["#9fd3ff", "#8cc6f5", "#7fb8f0", "#f2a477", "#24408f", "#0d0b2e"]; // the sky you rush through on the way up
  const TIERC = ["#7bd389", "#3fc29a", "#55b3ff", "#a07bff", "#ff6ad5", "#ffd23f"];
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } };
  const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const escM = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const fmt = n => Math.round(n).toLocaleString() + "m";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const zoneOf = m => { let z = 0; ZONES.forEach((x, i) => { if (m >= x.at) z = i; }); return z; };
  let needName = false, st = null, stopped = false, pollT = 0, shown = 0, busy = false, scene = -1, countRaf = 0, muted = get("nova-moo-mute", false), ac = null;

  if (!document.getElementById("mooFonts")) {
    const l = document.createElement("link"); l.id = "mooFonts"; l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Mono:wght@400;700&display=swap";
    document.head.appendChild(l);
  }
  SCENES.forEach(u => { const i = new Image(); i.src = u; }); // warm the cache so the sky changes instantly

  /* ----- the little pixel cow, carried by an alien's UFO and its tractor beam ----- */

    try {
      const d = await api("/api/moo", {method: "POST", body: JSON.stringify({action, i: st.answers.length, answer})});
      busy = false; const before = st.total; st = d.state; reveal(d.result, before);
    } catch (e) {
      busy = false; if (handleAuthError(e)) return;
      if (e.status === 401 && e.data?.code === "name") { needName = true; return title(); }
      if (e.data?.state) { st = e.data.state; return play(); }
      form?.classList.remove("wait");
      if (err) err.textContent = e.message;
      if (form) { form.classList.remove("bad"); void form.offsetWidth; form.classList.add("bad"); form.querySelector("input").select(); }
      sfx.bad();
    }
  }
  function reveal(r, before) {
    dots();
    const t = r.tier, last = st.done;
    main.className = "mmain mres";
    main.innerHTML = t < 0 ? `<div class="mtier" style="--k:#aab3e6">Skipped</div><p class="mnote">${escM(r.note)}</p>` :
      `<div class="mico" style="--k:${TIERC[t]}"></div><div class="mtier" style="--k:${TIERC[t]}">${escM(st.tiers[t])}</div>
      <div class="mrare"><small>Common</small>${TIERC.map((c, k) => `<i style="--k:${c}" class="${k === t ? "on" : ""}"></i>`).join("")}<small>Rare</small></div>
      <div class="mans">“${escM(r.answer)}”</div><div class="mpts"><b>+${r.m.toLocaleString()}m</b> · up to ${fmt(st.total)}</div><p class="mnote">${escM(r.note)}</p>`;
    main.insertAdjacentHTML("beforeend", `<button type="button" class="mgo mnext">${last ? "See my flight ▸" : "Next ▸"}</button>`);
    const next = main.querySelector(".mnext"); next.onclick = () => { sfx.tap(); last ? results() : play(); };
    const land = () => { main.classList.remove("hold"); setTimeout(() => next.focus({preventScroll: true}), 50); };
    if (t < 0 || reduce) { if (t >= 0) sfx.rise(t); countTo(before, st.total); return land(); }
    main.classList.add("hold"); // the result shows once the cow has landed
    sfx.wind(t);
    fly(t, before, st.total, () => { sfx.rise(t); land(); });
  }
  function results() {
    playing(true); placeCow("air"); shown = st.total; hud(st.total); setScene(ZONES[zoneOf(st.total)].scene); dots();
    $m(".mquit").textContent = "Menu";
    const z = ZONES[zoneOf(st.total)];
    const rows = st.answers.map((a, k) => `<li><span class="mp">${escM(st.prompts[k] || "")}</span><b>${a.tier < 0 ? "skipped" : escM(a.answer)}</b><i style="--k:${a.tier < 0 ? "#555" : TIERC[a.tier]}">${a.tier < 0 ? "–" : escM(st.tiers[a.tier])}</i><em>+${a.m.toLocaleString()}m</em></li>`).join("");
    main.className = "mmain mend";
    main.innerHTML = `<div class="mpanel"><small>Flight complete · #${st.num}</small><h2>${fmt(st.total)}</h2><p>You reached <b>${escM(z.name)}</b>${st.streak ? ` · 🔥 ${st.streak} day streak` : ""}</p>
      <ol class="mlist">${rows}</ol><div class="mrow"><button type="button" class="mgo sm mshare">Copy my flight</button><button type="button" class="mbar sm mlb">Leaderboard</button></div><p class="mtiny">New prompts at midnight.</p></div>`;
    main.querySelector(".mlb").onclick = () => board();
    main.querySelector(".mshare").onclick = e => {
      const sq = ["🟩", "🟢", "🟦", "🟪", "🩷", "⭐"];
      const txt = `Moo-llion #${st.num} 🐄🛸 ${fmt(st.total)}\n${st.answers.map(a => a.tier < 0 ? "⬛" : sq[a.tier]).join("")}\nmoollion.cc`;
      navigator.clipboard?.writeText(txt).then(() => { e.target.textContent = "Copied!"; setTimeout(() => e.target.textContent = "Copy my flight", 1400); }, () => {});
    };
  }
  function board() {
    const done = st && st.done;
    playing(false); setScene(done ? ZONES[zoneOf(st.total)].scene : 0); placeCow(done ? "air" : "ground");
    main.className = "mmain mend";
    const rows = (st?.board || []).map((p, k) => `<li class="${p.me ? "me" : ""}"><span class="mrk">${k + 1}</span><b>${escM(p.name)}</b>${p.count < st.count ? `<em class="mflying">flying… ${p.count}/${st.count}</em>` : p.best ? `<em>best: “${escM(p.best.answer)}”</em>` : "<em></em>"}<i>${fmt(p.total)}</i></li>`).join("");
    main.innerHTML = `<div class="mpanel"><small>Today · #${st ? st.num : ""}</small><h2>Leaderboard</h2>${rows ? `<ol class="mboard">${rows}</ol>` : `<p>No one has floated yet today. Be the first!</p>`}
      ${done ? "" : `<p class="mtiny">Finish your flight to see everyone's best answers.</p>`}<div class="mrow"><button type="button" class="mgo sm mback">◂ Back</button></div></div>`;
    main.querySelector(".mback").onclick = () => title();
  }

  async function load() {
    const slow = setTimeout(() => { const g = main.querySelector(".mgo"); if (g && !st) g.textContent = "Inflating today's balloon…"; }, 2500);
    try {
      const d = await api("/api/moo");
      clearTimeout(slow);
      if (stopped) return;
      if (d.preparing) { const g = main.querySelector(".mgo"); if (g) g.textContent = "Inflating today's balloon…"; pollT = setTimeout(load, 3000); return; }
      st = d; needName = false; title();
    } catch (e) {
      clearTimeout(slow);
      if (stopped) return;
      if (e.status === 401 && e.data?.code === "name") { needName = true; return title(); }
      if (handleAuthError(e)) return;
      const g = main.querySelector(".mgo"); if (g) { g.disabled = false; g.textContent = "Couldn't reach the sky. Try again"; g.onclick = () => { g.disabled = true; g.textContent = "Inflating today's balloon…"; load(); }; }
    }
  }
  title(); load();
  return {stop() { stopped = true; clearTimeout(pollT); cancelAnimationFrame(countRaf); cancelAnimationFrame(flyRaf); cancelAnimationFrame(rig.raf); document.removeEventListener("keydown", onKey); if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen)?.call(document)?.catch?.(() => {}); }};
}

startMoo(document.getElementById("root"));
</script>
</body>
</html>
