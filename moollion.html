<body>
<div id="root"></div>
<script>
/* Moo-llion on its own site. No accounts: this browser keeps a random player id, and you pick a name. */
let PID = null;
try { PID = localStorage.getItem("moollion-player"); } catch {}
if (!/^[a-f0-9]{32}$/.test(PID || "")) {
  PID = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, "0")).join("");
  try { localStorage.setItem("moollion-player", PID); } catch {}
}
async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {"Content-Type": "application/json", "x-moo-player": PID}});
  let d = {};
  try { d = await r.json(); } catch {}
  if (!r.ok) { const e = new Error(d.error || "Something went wrong"); e.status = r.status; e.data = d; throw e; }
  return d;
}
function handleAuthError() { return false; }

/* ---------- Moo-llion: daily word game, the rarer your answer the higher your cow floats ---------- */
function startMoo(root, opts = {}) {
  const IMG = "https://d8j0ntlcm91z4.cloudfront.net/user_3KOBfqwOB9ikrbu9I0UQir2iysj/hf_20261109_";
  const SCENES = ["010015_b7dfcf78-f8cd-4ca6-afe7-28cc5c5c705a", "010014_0b70e6ac-9caf-47e8-a9a9-fc84493a60a1", "010014_06a075f2-9d53-4f46-bbf8-cccd147b1b17",
    "010014_7805181d-ae17-4f85-88b4-badffc9feb02", "010015_477b5311-ba65-4b30-9b88-cab11688d00d", "010013_e8d385b4-bd8f-45bf-a541-948406faccf6",
    "010013_87567b9b-0dc4-43e7-b16d-ee1b203ec47e"].map(id => IMG + id + "_min.webp");
  // where you are in the sky (by total height), with the picture for each
  const ZONES = [
    {at: 0, scene: 1, name: "The Pasture", text: "Hay bales, a red barn, a winding path. Your hooves just left the grass."},
    {at: 200, scene: 2, name: "The Treetops", text: "The roof of the forest, right under your hooves."},
    {at: 900, scene: 3, name: "The Clouds", text: "Soft white puffs on every side. The farm is a quilt far below."},
    {at: 3000, scene: 4, name: "The Jet Stream", text: "Fast winds and a golden sunset. A plane waves its wings at you."},
    {at: 8000, scene: 5, name: "The Stratosphere", text: "The Earth curves away below and the sky turns dark blue."},
    {at: 15000, scene: 6, name: "Deep Space", text: "Stars all around and the Moon up close. One in a moo-llion."},
  ];
  const SKY = ["#9fd3ff", "#8cc6f5", "#7fb8f0", "#f2a477", "#24408f", "#0d0b2e"]; // the sky you rush through on the way up
  const TIERC = ["#7bd389", "#3fc29a", "#55b3ff", "#a07bff", "#ff6ad5", "#ffd23f"];
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } };
  const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const escM = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const fmt = n => Math.round(n).toLocaleString() + "m";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const zoneOf = m => { let z = 0; ZONES.forEach((x, i) => { if (m >= x.at) z = i; }); return z; };
  let needName = false, st = null, stopped = false, pollT = 0, shown = 0, busy = false, scene = -1, countRaf = 0, muted = get("nova-moo-mute", false), ac = null;

  if (!document.getElementById("mooFonts")) {
    const l = document.createElement("link"); l.id = "mooFonts"; l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Mono:wght@400;700&display=swap";
    document.head.appendChild(l);
  }
  SCENES.forEach(u => { const i = new Image(); i.src = u; }); // warm the cache so the sky changes instantly

  /* ----- the little pixel cow, carried by an alien's UFO and its tractor beam ----- */
  const COW = ["...........hh...", "..kkkkkkkkkkkkkk", ".kwwbbwwwwbwkwek", "kwbbbwwwwwwkwwwk", ".kwwbwwwbbwwkppk", "..kwwwwwbbbwwkpk", "..kkkkkkkkkkkkk.", "..k.k.....k.k...", "..n.n.....n.n..."];
  const CP = {w: "#ffffff", k: "#1a1a24", b: "#2b2b36", h: "#f2e3b3", p: "#ffb3c1", e: "#1a1a24", n: "#3a3a46"};
  const SHIP = {hull: "#9b7bff", hullD: "#5b3fc4", dome: "#bff4ff", lights: "#7dffb0", alien: "#4ee08a", beam: "110,230,255"};
  const RW = 60, RH = 84, RS = 3, IDLE_Y = 44;
  const rig = {s: 0.06, ts: 0.06, y: IDLE_Y, ty: IDLE_Y, raf: 0, last: 0};
  // The art stays chunky (1 art pixel = 3 screen pixels) but it MOVES in single screen pixels, so hovering and lifting look smooth.
  const SC = Math.max(RS, Math.round(RS * Math.min(3, window.devicePixelRatio || 1))), snap = v => Math.round(v * SC) / SC;
  function rigCanvas() {
    const c = document.createElement("canvas"); c.width = RW * SC; c.height = RH * SC; c.className = "moocow";
    c.style.width = RW * RS + "px"; c.style.height = RH * RS + "px";
    const x = c.getContext("2d"); x.setTransform(SC, 0, 0, SC, 0, 0); x.imageSmoothingEnabled = false;
    return c;
  }
  function drawShip(x, ox, oy, t) {
    const px = (X, Y, c) => { x.fillStyle = c; x.fillRect(ox + X, oy + Y, 1, 1); }, cx = 13, K = "#1a1a24";
    for (let y = 0; y < 6; y++) for (let X = 0; X < 26; X++) { const d = ((X - cx) / 6) ** 2 + ((y - 6) / 5.5) ** 2; if (d <= 1) px(X, y + 1, d > 0.8 ? K : SHIP.dome); }
    px(cx - 3, 3, "#fff"); px(cx - 2, 2, "#fff");
    const wave = Math.floor(t * 3) % 2; // the alien waves at you
    [[cx - 1, 4], [cx, 4], [cx + 1, 4], [cx - 1, 5], [cx, 5], [cx + 1, 5], [cx - 2, 3], [cx + 2, wave ? 2 : 3]].forEach(([a, b]) => px(a, b, SHIP.alien));
    px(cx - 1, 4, K); px(cx + 1, 4, K);
    for (let y = 0; y < 7; y++) for (let X = 0; X < 26; X++) { const d = ((X - cx) / 12.5) ** 2 + ((y - 3) / 3.4) ** 2; if (d <= 1) px(X, y + 6, d > 0.82 ? K : y < 3 ? SHIP.hull : SHIP.hullD); }
    const blink = Math.floor(t * 4) % 2;
    for (let X = 3; X < 24; X += 3) px(X, 9, (X / 3) % 2 === blink ? SHIP.lights : "#3a3a46");
    for (let X = cx - 3; X <= cx + 3; X++) px(X, 13, "rgb(" + SHIP.beam + ")");
  }
  function drawBeam(x, ox, top, bottom, s, t) { // s = beam strength from 0 to 1
    const half0 = 3 + s * 2, half1 = 6 + s * 21, fl = s < 0.3 ? 0.7 + Math.random() * 0.3 : 1, shift = Math.floor(t * 14);
    for (let y = top; y < bottom; y++) {
      const k = (y - top) / Math.max(1, bottom - top), half = half0 + (half1 - half0) * k;
      for (let X = Math.round(-half); X <= Math.round(half); X++) {
        const edge = Math.abs(X) / half, band = (((y + shift + Math.floor(X / 3)) % 4) + 4) % 4 === 0 ? 0.05 + s * 0.15 : 0;
        const fade = 1 - k * (0.75 - s * 0.6); // weak beams fade out lower down, strong ones reach the ground
        const a = Math.min(0.85, ((0.12 + s * 0.5) * (1 - edge * edge * 0.7) + band) * fl * fade);
        x.fillStyle = "rgba(" + SHIP.beam + "," + a.toFixed(2) + ")"; x.fillRect(ox + X, y, 1, 1);
      }
    }
    for (let i = 0; i < 2 + s * 16; i++) { // sparkles drifting up the beam
      const y = top + Math.random() * (bottom - top), k = (y - top) / Math.max(1, bottom - top), half = (half0 + (half1 - half0) * k) * 0.85;
      x.fillStyle = Math.random() < 0.3 ? "#fff3a8" : "#ffffff"; x.fillRect(ox + Math.round((Math.random() * 2 - 1) * half), Math.round(y), 1, 1);
    }
  }
  function drawRig(now) {
    const c = root.querySelector(".moocow"); if (!c) return;
    const x = c.getContext("2d"), t = now / 1000, hover = snap(Math.sin(t * 2) * 1.2);
    const cowY = snap(rig.y + Math.sin(t * 2.6) * 1.4), oy = 3 + hover;
    x.clearRect(0, 0, RW, RH);
    drawBeam(x, 30, oy + 13, RH, rig.s, t);
    drawShip(x, 17, oy, t);
    COW.forEach((r, yy) => [...r].forEach((ch, i) => { if (CP[ch]) { x.fillStyle = CP[ch]; x.fillRect(22 + i, cowY + yy, 1, 1); } }));
  }
  function rigLoop(now) {
    if (stopped) return;
    rig.raf = requestAnimationFrame(rigLoop);
    const dt = Math.min(4, (now - (rig.last || now)) / 16.7); rig.last = now; // eased by real time, so it looks the same on any screen
    rig.s += (rig.ts - rig.s) * (1 - Math.pow(0.94, dt)); rig.y += (rig.ty - rig.y) * (1 - Math.pow(0.955, dt));
    drawRig(now);
  }

  /* ----- little sounds (can be muted) ----- */
  function tone(f, t0, dur, type = "square", vol = 0.05) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
      o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch {}
  }
  const sfx = {
    tap: () => tone(660, 0, 0.06),
    bad: () => { tone(220, 0, 0.12, "sawtooth", 0.04); tone(180, 0.1, 0.16, "sawtooth", 0.04); },
    wind: tier => { // a gust of wind: filtered noise that swells and fades
      if (muted) return;
      try {
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        const len = FLY_MS[tier] / 1000, n = Math.floor(ac.sampleRate * len), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
        for (let k = 0; k < n; k++) d[k] = Math.random() * 2 - 1;
        const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime;
        src.buffer = buf; f.type = "bandpass"; f.Q.value = 0.8;
        f.frequency.setValueAtTime(260, t); f.frequency.exponentialRampToValueAtTime(500 + tier * 420, t + len * 0.45); f.frequency.exponentialRampToValueAtTime(220, t + len);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05 + tier * 0.025, t + len * 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
        src.connect(f).connect(g).connect(ac.destination); src.start(t);
      } catch {}
    },
    rise: tier => { [0, 1, 2, 3, 4].slice(0, tier + 2).forEach((k, i) => tone(392 * Math.pow(1.26, k), i * 0.09, 0.14, "triangle", 0.06)); },
  };

  /* ----- the shell: sky, HUD, and the middle area that changes ----- */
  root.innerHTML = `<div class="moo"><div class="moobg">${SCENES.map((u, i) => `<i data-s="${i}" style="background-image:url('${u}')"></i>`).join("")}</div>
    <div class="mootransit"></div><canvas class="moowind" aria-hidden="true"></canvas><div class="moofx"></div><div class="moocowwrap"></div>
    <div class="moohud" hidden><div class="mbox malt"><small>Altitude</small><b>0m</b></div><div class="mbox mzone"><b></b><span></span></div></div>
    <div class="mbox mprog" hidden><div class="mdots"></div><small></small></div>
    <div class="mtopr"><button type="button" class="mbox mbtn msnd" aria-label="Sound"></button><button type="button" class="mbox mbtn mfs" aria-label="Full screen">⛶</button><button type="button" class="mbox mbtn mquit" hidden>Quit</button></div>
    <div class="mruler" hidden><div class="mline"></div><div class="mticks"></div><div class="mmark"><span></span></div></div>
    <div class="mmain"></div><div class="mscan"></div></div>`;
  const $m = s => root.querySelector(s), main = $m(".mmain"), wrap = $m(".moo");
  const sndBtn = $m(".msnd"), syncSnd = () => { sndBtn.textContent = muted ? "🔇" : "🔊"; sndBtn.setAttribute("aria-pressed", String(!muted)); };
  syncSnd(); sndBtn.onclick = () => { muted = !muted; set("nova-moo-mute", muted); syncSnd(); sfx.tap(); };
  $m(".mquit").onclick = () => title();
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  $m(".mfs").onclick = async () => {
    if (fsEl() || wrap.classList.contains("mfull")) { wrap.classList.remove("mfull"); if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen)?.call(document)?.catch?.(() => {}); return; }
    try { await (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap); } catch { wrap.classList.add("mfull"); }
  };
  const onKey = e => { if (e.key === "Escape" && wrap.classList.contains("mfull")) wrap.classList.remove("mfull"); };
  document.addEventListener("keydown", onKey);

  function setScene(i, replay) {
    if (i === scene) {
      if (!replay) return;
      const el = root.querySelector(".moobg i.on"); if (el) { el.classList.remove("drop"); void el.offsetWidth; el.classList.add("drop"); }
      return;
    }
    const old = root.querySelector(".moobg i.on");
    if (old) { old.classList.remove("on"); old.classList.add("off"); setTimeout(() => old.classList.remove("off"), 1400); }
    root.querySelector(`.moobg i[data-s="${i}"]`)?.classList.add("on");
    scene = i;
  }
  function placeCow(mode) { // "ground" on the title screen (the UFO hovers over the cow), "air" while playing
    const w = $m(".moocowwrap");
    if (!w.firstChild) w.appendChild(rigCanvas());
    if (!rig.raf) rig.raf = requestAnimationFrame(rigLoop);
    w.className = "moocowwrap " + mode;
    rig.ts = mode === "ground" ? 0.06 : 0.14; rig.ty = mode === "ground" ? IDLE_Y : IDLE_Y - 6;
  }

  /* ----- HUD ----- */
  function hud(alt) {
    const z = ZONES[zoneOf(alt)];
    $m(".malt b").textContent = fmt(alt);
    $m(".mzone b").textContent = z.name; $m(".mzone span").textContent = z.text;
    // ruler: 0 at the bottom, a round number above you at the top
    const steps = [500, 1000, 2500, 5000, 10000, 20000, 40000, 80000];
    const top = steps.find(s => s >= alt * 1.25 + 100) || steps[steps.length - 1];
    const ticks = $m(".mticks");
    if (ticks.dataset.top !== String(top)) {
      ticks.dataset.top = top;
      ticks.innerHTML = Array.from({length: 6}, (_, k) => { const v = top * (5 - k) / 5; return `<span style="top:${k * 20}%">${v >= 1000 ? (v / 1000).toLocaleString() + "km" : v + "m"}</span>`; }).join("");
    }
    const mk = $m(".mmark"); mk.style.top = (100 - Math.min(100, alt / top * 100)) + "%"; mk.querySelector("span").textContent = fmt(alt);
  }
  function dots() {
    const n = st.count, a = st.answers.length;
    $m(".mdots").innerHTML = Array.from({length: n}, (_, k) => `<i class="${k < a ? "on" : ""}" style="${k < a && st.answers[k].tier >= 0 ? `--k:${TIERC[st.answers[k].tier]}` : ""}"></i>`).join("");
    $m(".mprog small").textContent = st.done ? "Flight complete" : `Prompt ${Math.min(n, a + 1)} of ${n}`;
  }
  function countTo(from, to, dur = 1300, scenes = true) {
    cancelAnimationFrame(countRaf);
    if (reduce) { shown = to; hud(to); return; }
    const t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      shown = from + (to - from) * e; hud(shown);
      if (scenes && (zoneOf(shown) !== zoneOf(from) || k === 1)) setScene(ZONES[zoneOf(shown)].scene);
      if (k < 1) countRaf = requestAnimationFrame(step);
    };
    countRaf = requestAnimationFrame(step);
  }
  /* ----- the flight: the cow moves to the middle, a gust lifts it, and the sky rushes past.

  function handle(ev, old) {
    const nm = i => i === room.me ? "You" : room.players[i]?.name || "Someone";
    if (ev.type === "start") { banner("Beam me up!", "Answer before the UFO gets you"); return; }
    if (ev.type === "join" && room.status !== "playing") { msg.textContent = (room.players[ev.by]?.name || "Someone") + " joined"; setTimeout(() => msg.textContent = "", 1800); return; }
    if (ev.type === "answer") {
      pop(ev.by, `“${esc(ev.answer)}” <b>${TIERS[ev.tier]}</b> <em>+${ev.pts}</em>`, TIERC[ev.tier]);
      sfx.good(ev.tier);
      if (ev.full) {
        const bar = root.querySelector(`.ptag[data-i="${ev.by}"] .bar i`);
        if (bar) { bar.dataset.hold = 1; bar.style.width = "100%"; setTimeout(() => { delete bar.dataset.hold; drawTags(); }, 900); }
        setTimeout(() => pop(ev.by, ev.bonus ? "+1 ♥" : "Max hearts!", "#ff5a6a", "life"), 500);
      }
      if (ev.round) setTimeout(() => banner("Round " + ev.round, "Higher up · a bit faster"), 600);
      return;
    }
    if (ev.type === "abduct") {
      anim = {i: ev.by, t0: performance.now(), out: ev.out, from: Math.round(lifts[ev.by] || 0)};
      sfx.zap();
      setTimeout(() => pop(ev.by, ev.out ? `${esc(nm(ev.by))} got abducted!` : "-1 ♥", "#ff5a4a", "life"), 450);
      if (ev.round) setTimeout(() => banner("Round " + ev.round, "Higher up · a bit faster"), 1300);
    }
    if (ev.type === "leave") { msg.textContent = (old?.players[ev.by]?.name || "Someone") + " left"; setTimeout(() => msg.textContent = "", 1800); }
  }

  /* ----- every frame: the UFO, its beam, the cows, and live typing ----- */
  const parts = []; // sparks from abductions
  function burst(x0, y0, n, cols) { for (let k = 0; k < n; k++) { const a = Math.random() * Math.PI * 2, v = 0.6 + Math.random() * 1.8; parts.push({x: x0, y: y0, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.4, life: 26 + Math.random() * 14, c: cols[k % cols.length]}); } }
  const RISE = 1.3, HOLD = 1.8, DROP = 2.45; // abduction timing (seconds)
  function frame(now) {
    raf = 0; if (stopped) return;
    raf = requestAnimationFrame(frame);
    const dt = Math.min(3, (now - (lastFrame || now)) / 16.7); lastFrame = now;
    const W = AW, H = AH, t = now / 1000; cx.clearRect(0, 0, W, H);
    if (!room || !room.players.length) { // menu: a lone UFO drifting over a cow
      const x0 = snap(W / 2 + Math.sin(t * 0.7) * 30), y0 = Math.round(H * 0.5), sy = snap(y0 + Math.sin(t * 2) * 1.2);
      drawBeam(cx, x0, sy + 13, y0 + 46, 0.15, t, 0); drawShip(cx, x0 - 13, sy, t, 0); drawCow(cx, x0 - 8, snap(y0 + 38 + Math.sin(t * 2.6) * 1.2), false);
      return;
    }
    const playing = room.status === "playing", by = baseY(), n = room.players.length;
    // how far along the beam is. It stands still while an answer is being checked (yours or anyone's), so checking never costs time.
    const paused = playing && ((sending && myTurn()) || room.hold);
    if (!playing) heatNow = 0; else if (!paused) heatNow = Math.max(0, Math.min(1, (Date.now() - beamRef.start) / (room.beamMs || 1)));
    const heat = heatNow;
    let abd = null;
    if (anim) { const k = (now - anim.t0) / 1000; if (k > DROP + 0.1) anim = null; else abd = {i: anim.i, k, out: anim.out}; }
    const ti = playing ? room.turn : -1, tx = abd ? seatX(abd.i) : ti >= 0 ? seatX(ti) : Math.round(W / 2);
    if (ufoX < 0) ufoX = tx;
    ufoX += (tx - ufoX) * (1 - Math.pow(0.84, dt)); // glides to whoever's turn it is
    const sh = abd && abd.k < RISE + 0.2 ? 1.6 : heat > 0.8 ? (heat - 0.8) * 6 : 0, shake = sh ? Math.sin(now * 0.09) * sh * 0.6 + Math.sin(now * 0.153 + 1) * sh * 0.4 : 0;
    ufoY = snap(H * 0.5 + Math.sin(t * 2) * 1.4 + shake);
    const ux = snap(ufoX);
    // the active cow floats up the beam faster and faster as time runs out
    lifts.length = n;
    for (let i = 0; i < n; i++) {
      const target = i === ti && Date.now() >= revealEnd && !abd ? Math.pow(heat, 1.8) * (by - ufoY - 20) : 0;
      lifts[i] = (lifts[i] || 0) + (target - (lifts[i] || 0)) * (1 - Math.pow(0.86, dt));
    }
    if (abd) { // the beam flares red and yanks the cow up, accelerating into the UFO
      const ax = ux;
      if (abd.k < RISE + 0.15) drawBeam(cx, ax, ufoY + 13, by + 9, 1, t, 1);
      else if (abd.k > HOLD && abd.k < DROP && !abd.out) drawBeam(cx, ax, ufoY + 13, by + 9, 0.3, t, 0);
      if (!anim.burst && abd.k >= RISE) { anim.burst = true; burst(ax, ufoY + 10, 26, ["#ff5a4a", "#ffe14a", "#fff", "#ff9f43"]); }
    } else if (playing && ti >= 0) drawBeam(cx, ux, ufoY + 13, by + 9, 0.15 + heat * 0.75, t, heat);
    for (let i = 0; i < n; i++) {
      const p = room.players[i], x0 = seatX(i) - 8, flip = i >= n / 2;
      const lift = lifts[i] || 0, sway = lift > 1 ? Math.sin(t * 5 + i) * Math.min(1.2, lift * 0.06) : 0; // a cow in the beam drifts a little
      let y0 = snap(by - lift);
      if (abd && abd.i === i) {
        const start = by - (anim.from || 0), top = ufoY + 4;
        if (abd.k < RISE) {
          const e = Math.pow(abd.k / RISE, 2.4), wob = snap(Math.sin(abd.k * 34) * 1.5 * e);
          for (let g = 3; g >= 1; g--) { const eg = Math.pow(Math.max(0, abd.k - g * 0.035) / RISE, 2.4); drawCow(cx, x0 + wob, snap(start - (start - top) * eg), flip, 0.12 * (4 - g)); }
          drawCow(cx, x0 + wob, snap(start - (start - top) * e), flip);
        } else if (abd.k >= HOLD && !abd.out) { // dropped back down, landing with a little bounce
          const e = Math.min(1, (abd.k - HOLD) / (DROP - HOLD)), b = Math.min(1, e / 0.8) ** 2, bounce = e > 0.8 ? Math.sin((e - 0.8) / 0.2 * Math.PI) * 2.5 : 0;
          drawCow(cx, x0, snap(top + (by - top) * b - bounce), flip);
        }
        continue;
      }
      if (playing && (!p.alive || p.left)) continue; // abducted for good
      drawCow(cx, x0 + snap(sway), y0, flip);
    }
    for (let k = parts.length - 1; k >= 0; k--) { const q = parts[k]; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 0.05 * dt; q.life -= dt; if (q.life <= 0) { parts.splice(k, 1); continue; } cx.fillStyle = q.c; cx.fillRect(snap(q.x), snap(q.y), 1, 1); }
    if (playing || anim) drawShip(cx, ux - 13, ufoY, t, abd && abd.k < RISE + 0.3 ? 1 : heat);
    // live typing for other players and bots
    const tb = $(".ptype");
    if (playing && !myTurn() && Date.now() >= revealEnd && !abd) {
      let target = "", bt = room.botType;
      if (bt && bt.turnId === room.turnId) { const k = Math.floor((Date.now() - botStart.at) / bt.per); target = bt.text.slice(0, Math.max(0, Math.min(bt.text.length, k))); }
      else target = room.typing?.text || "";
      if (remote.turnId !== room.turnId) remote = {turnId: room.turnId, shown: "", last: 0};
      if (target.startsWith(remote.shown) && target.length > remote.shown.length) { if (now - remote.last > 40) { remote.shown = target.slice(0, remote.shown.length + 1); remote.last = now; } }
      else if (!target.startsWith(remote.shown)) remote.shown = target;
      tb.hidden = !remote.shown; tb.textContent = remote.shown; tb.classList.toggle("bad", !!room.typing?.bad && !bt);
      tb.style.left = seatX(ti) * S + "px"; tb.style.top = (by - (lifts[ti] || 0) - 8) * S + "px";
    } else tb.hidden = true;
    wrap.classList.toggle("pdanger", playing && myTurn() && heat > 0.8 && !paused);
  }

  menu();
  return {stop() { stopped = true; clearTimeout(poll); clearTimeout(typeTimer); clearTimeout(checkT); cancelAnimationFrame(raf); removeEventListener("resize", onResize); document.removeEventListener("visibilitychange", onShow); }};
}

// two modes share the page: the daily game and Alien Party
const ROOT = document.getElementById("root");
let CUR = null;
function goDaily() { if (CUR) CUR.stop(); CUR = startMoo(ROOT, {onParty: goParty}); history.replaceState(null, "", location.pathname); }
function goParty() { if (CUR) CUR.stop(); CUR = startParty(ROOT, {onBack: goDaily}); history.replaceState(null, "", location.pathname + "#party"); }
if (location.hash === "#party") goParty(); else goDaily();
</script>
